<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client/Server via iframe</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <h1>Client Application</h1>
        <p>Communicate with the server iframe to get weather data.</p>
        <div class="controls">
            <input type="text" id="city-input" placeholder="Enter a city name" value="London">
            <button id="send-button">Get Weather</button>
        </div>
        <h2>Server Response:</h2>
        <pre id="response-log">Waiting for data...</pre>
    </div>

    <iframe id="server-iframe" src="https://weather-api--api.on.websim.com/" style="display: none;"></iframe>

    <script src="client.js"></script>
